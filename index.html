<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ceqellsite</title>
    <style>
        /* --- RESET & BASE --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
        }

        /* --- CUSTOM TEXT SELECTION --- */
        ::selection {
            background-color: #ffcc00; /* The Amber Block */
            color: #000000;            /* The Text turns Black */
        }

        /* Firefox compatibility (optional but good practice) */
        ::-moz-selection {
            background-color: #ffcc00;
            color: #000000;
        }

		/* --- LAYOUT CONTAINER --- */
		.scene-container {
			position: relative;
			width: 100vw;
			height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			overflow: hidden; /* Prevents scrollbars */
		}

        /* The Monitor Overlay (Foreground) */
		.monitor-overlay {
			position: relative; /* Must be positioned for z-index to work */
			z-index: 20;
			width: 100%;
			height: 100%;
			display: block;
			pointer-events: none; /* Allows you to click text "through" the hole if needed */
		}

        /* --- NEW WRAPPER --- */
		.retro-container {
			position: relative;
    
			/* 1. YOUR EXACT IMAGE DIMENSIONS */
			--img-width: 2752; 
			--img-height: 1535;

			/* 2. THE MATH (Keeps the aspect ratio locked) */
			width: min(100vw, calc(100vh * (var(--img-width) / var(--img-height))));
			height: min(100vh, calc(100vw * (var(--img-height) / var(--img-width))));
		}

		/* --- THE MONITOR SCREEN --- */
		.monitor-screen {
			position: absolute;
			z-index: 1;
			overflow: hidden;
    
			/* CALCULATED VALUES FROM YOUR IMAGE */
			top: 9.75%;
			left: 38.53%;
			width: 26.94%;
			height: 37%;

			/* CRT Styling */
			background-color: #1a1a1a;
			border-radius: 2px; /* Slight rounded corner for CRT feel */
		}

        /* --- RETRO AESTHETICS --- */
        :root {
            --amber: #ffcc00; /* Yellowish/gold amber */
            --amber-dim: #997a00;
            --scanline-color: rgba(0, 0, 0, 0.5);
        }

        .crt-content {
            width: 100%;
            height: 100%;
            background-color: #120d00;
            color: var(--amber);
            padding: 20px;
            font-size: 12px;
            line-height: 1.3;
            overflow-y: auto;
            overflow-x: hidden;
            
            text-shadow: 0 0 2px var(--amber-dim), 0 0 5px var(--amber);
            scrollbar-width: thin;
            scrollbar-color: var(--amber) #120d00;
        }

        .crt-content::-webkit-scrollbar {
            width: 8px;
        }
        .crt-content::-webkit-scrollbar-track {
            background: #120d00;
        }
        .crt-content::-webkit-scrollbar-thumb {
            background-color: var(--amber);
            border: 1px solid #120d00;
        }

        /* Scanlines */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 20;
            opacity: 0.6;
        }

        /* Flicker */
        .flicker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 176, 0, 0.02);
            opacity: 0;
            z-index: 21;
            pointer-events: none;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.02; }
            50% { opacity: 0.05; }
            100% { opacity: 0.02; }
        }

        /* --- CONTENT STYLING --- */
        h1, h2, h3 {
            margin-bottom: 10px;
            text-transform: uppercase;
            border-bottom: 2px solid var(--amber);
            display: inline-block;
        }

        p {
            margin-bottom: 15px;
        }

        .nav-link {
            display: inline-block;
            margin-right: 15px;
            cursor: pointer;
            text-decoration: none;
            color: var(--amber);
            border: 1px solid transparent;
            padding: 2px 5px;
        }

        .nav-link:hover, .nav-link.active {
            background-color: var(--amber);
            color: #000;
            text-shadow: none;
            font-weight: bold;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background-color: var(--amber);
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .tab {
            display: inline-block;
            margin-left: 4em;
        }


        /* --- HYPERLINK STYLING --- */
        /* Target all links inside the content area */
        .crt-content a {
            color: #ffcc00;            /* Force Amber color */
            text-decoration: underline; /* Add the underline */
            text-decoration-thickness: 1px; /* Keep it crisp */
            cursor: pointer;
        }

        /* IMPORTANT: Fix the "Visited" link color (stops it turning purple) */
        .crt-content a:visited {
            color: #ffcc00;
        }

        /* Optional: Cool retro hover effect */
        .crt-content a:hover {
            background-color: #ffcc00; /* Amber block */
            color: #000;               /* Black text */
            text-decoration: none;
        }

    </style>
</head>
<body>

	<audio id="bg-audio" src="computer_hum.mp3"></audio>

    <audio id="click-audio" src="mouse_click.mp3" preload="auto"></audio>

    <div class="scene-container" id="scene-container">
        <div class="retro-container">
			<!-- The Interactive Monitor Screen -->
			<div class="monitor-screen" id="monitor-box">
				<div class="scanlines"></div>
				<div class="flicker"></div>
            
				<div class="crt-content">
					<div id="header-area">
						<div>OS: WEBKIT_KERNEL_V4.2</div>
						<div>MEM: 64KB OK</div>
						<div><br></div>
						<h1>ceqellsite</h1>
						<div><br></div>
						<nav>
							<a class="nav-link active" data-target="home" onclick="navigate('home')">[HOME]</a>
							<a class="nav-link" data-target="about" onclick="navigate('about')">[ABOUT]</a>
							<a class="nav-link" data-target="projects" onclick="navigate('projects')">[PROJECTS]</a>
							<a class="nav-link" data-target="contact" onclick="navigate('contact')">[CONTACT]</a>
                            <a class="nav-link" data-target="sourcecode" onclick="navigate('sourcecode')">[SOURCE]</a>
						</nav>
						<div>----------------------------------------</div>
						<div><br></div>
					</div>

                <div id="content-display"></div>
            </div>
        </div>

			<!-- The Monitor Overlay -->
			<img class="monitor-overlay" src="computerscreen.webp" alt="Retro Monitor Overlay">
		</div>
    </div>
	
    <script>

        /* --- AUDIO SYSTEM --- */
        const humAudio = document.getElementById("bg-audio");
        const clickSource = "mouse_click.mp3"; 

        // 1. SETUP BACKGROUND HUM
        const baseVolume = 0.5; // The normal volume level
        humAudio.volume = baseVolume; 

        // Custom Loop: When finished, go back to 10s
        humAudio.addEventListener('ended', function() {
            this.currentTime = 10; 
            this.play();           
        });

        // Attempt Auto-play
        const playPromise = humAudio.play();
        if (playPromise !== undefined) {
            playPromise.catch(error => {
                // If blocked, wait for first interaction
               document.addEventListener('click', () => {
                   humAudio.play();
               }, { once: true });
          });
       }

      /* --- NEW: FADE OUT ON TAB SWITCH --- */
      let fadeTimer;

      function fadeAudio(targetVolume) {
          // Clear any currently running fade to prevent "fighting"
          if (fadeTimer) clearInterval(fadeTimer);

          fadeTimer = setInterval(() => {
              let current = humAudio.volume;

              // If we are close enough to the target, snap to it and stop
              if (Math.abs(current - targetVolume) < 0.02) {
                  humAudio.volume = targetVolume;
                  clearInterval(fadeTimer);
              } else {
                  // Otherwise, move volume towards target by 0.02 step
                  if (current > targetVolume) {
                      humAudio.volume = Math.max(0, current - 0.02);
                  } else {
                      humAudio.volume = Math.min(baseVolume, current + 0.02);
                  }
              }
          }, 50); // Run every 50ms for a smooth fade
      }

        // 2. SETUP CLICK SOUNDS
        function playClickSound() {
            // We create a new Audio object for every click so they can overlap 
            // (if the user clicks fast, it won't cut off the previous sound)
            const sound = new Audio(clickSource);
            sound.volume = 0.3;
            sound.play();
        }

        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
              fadeAudio(0); // Tab hidden? Fade to 0
          } else {
              fadeAudio(baseVolume); // Tab back? Fade to 0.5
          }
      });

        // Attach click sound to all nav links
        document.addEventListener('click', function(e) {
        // Check if the clicked element (or its parent) is an <a> tag
            if (e.target.closest('a')) {
                playClickSound();
            }
        });

        // --- CONTENT LOGIC ---
        const pages = {
            home: `WELCOME TO MY WEBSITE!
            <br><br>
            THIS IS A TEXT-BASED INTERFACE RUNNING ON A LEGACY SYSTEM.<br>
            USE THE NAVIGATION BAR ABOVE TO ACCESS FILES.
            <br><br>
            STATUS: ONLINE<br>
            CONNECTION: SECURE<br>
            DATE: ${new Date().toLocaleDateString()}<br>`,
            about: `> LOAD BIO.TXT<br><br>

            Up until 2021-2022, I still used our old samsung family laptop which we considered our only computer that had an old 
            intel and 2GB of DDR3 to play mostly roblox games, and growing up in rural Thailand you're always surrounded by old and retro tech. So yeah, I kinda grew up to love these kinds
            of old, retro and vintage machines and software made way before I was even concieved. I always like breaking apart toys and other electronics and seeing how they all work with all the 
            circuit wires and what not, tinkering and then eventually making things as I grew older, it's been a nice journey so far.
            <br><br>
            STUFF I DO:<br>
            * HTML / CSS / JS<br>
            * ELECTRONICS<br>
            * SYSTEM ARCHITECTURE<br>
            * UNIX-LIKE OPERATING SYSTEMS<br>`,
            projects: `> LIST PROJECTS_DIR/<br><br>

            WIP<br>`,
            contact: `> OPEN MAIL_CLIENT<br><br>

            EMAIL: ceqell@ceqell.me<br>
            GITHUB: <a href="https://github.com/Ceqell">https://github.com/Ceqell</a><br><br>

            TRANSMISSION END.<br>`,
            sourcecode: `> OPEN SRC.TXT<br><br>

            THIS WEBSITE IS LICENSED UNDER THE APACHE LICENSE 2.0.<br>
            THE SOURCE CODE OF WHICH, CAN BE VIEWED HERE:<br><br>
            <a href="https://github.com/Ceqell/ceqell" class="tab" target="_blank">https://github.com/Ceqell/ceqell</a><br>`
        };

        const displayElement = document.getElementById('content-display');
    let currentTimeout; // To track and stop typing if user switches pages

    // The "Smart" Typing Function
    function typeHTML(htmlText) {
        let i = 0;
        displayElement.innerHTML = '<span class="cursor"></span>'; 

        function type() {
            if (i < htmlText.length) {
                let char = htmlText.charAt(i);

                // --- SMART SCROLL CHECK ---
                // 1. Get the container
                const container = document.querySelector('.crt-content');
                // 2. Check if user is near the bottom (within 50px buffer) BEFORE we add text
                // If this is true, we will auto-scroll. If false (user scrolled up), we won't.
                const shouldAutoScroll = (container.scrollHeight - container.scrollTop - container.clientHeight) < 50;

                // --- TYPING LOGIC ---
                if (char === '<') {
                    let tag = '';
                    while (htmlText.charAt(i) !== '>' && i < htmlText.length) {
                        tag += htmlText.charAt(i);
                        i++;
                    }
                    tag += '>'; 
                    i++; 
                    displayElement.innerHTML = displayElement.innerHTML.replace('<span class="cursor"></span>', tag + '<span class="cursor"></span>');
                    
                    // Recursive call (don't wait)
                    type(); 
                } 
                else {
                    i++;
                    displayElement.innerHTML = displayElement.innerHTML.replace('<span class="cursor"></span>', char + '<span class="cursor"></span>');
                    
                    // --- APPLY SCROLL ---
                    // Only force scroll if the user was ALREADY at the bottom
                    if (shouldAutoScroll) {
                        container.scrollTop = container.scrollHeight;
                    }

                    // Change the typing speed (default is 15ms) here
                    currentTimeout = setTimeout(type, 15);
                }
            }
        }
        type();
    }

    function navigate(pageId) {
        // 1. Update Links
        const links = document.querySelectorAll('.nav-link');
        links.forEach(link => {
            if (link.dataset.target === pageId) link.classList.add('active');
            else link.classList.remove('active');
        });

        // 2. Clear previous typing
        if (currentTimeout) clearTimeout(currentTimeout);

        // 3. Start Typing Logic
        if (pages[pageId]) {
            typeHTML(pages[pageId]);
        }
    }

    window.onload = function() {
        navigate('home');
    };

    </script>
	
</body>
</html>
